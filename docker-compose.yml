services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "4001"
      STORAGE_DIR: /app/storage
      RECORDING_FFMPEG_PATH: ffmpeg
      MEDIASOUP_WORKERS: "2"
      MEDIASOUP_MIN_PORT: "40000"
      MEDIASOUP_MAX_PORT: "40199"
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-46.246.120.148}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      FRONTEND_URL: ${FRONTEND_URL:-https://46.246.120.148:8981}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://46.246.120.148:8981}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://46.246.120.148:8981/auth/google/callback}
    ports:
      - "40000-40199:40000-40199/udp"
    volumes:
      - server_storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-https://46.246.120.148:8981}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "8981:443"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server_storage:
