services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "4001"
      STORAGE_DIR: /app/storage
      RECORDING_FFMPEG_PATH: ffmpeg
      MEDIASOUP_WORKERS: "2"
      MEDIASOUP_MIN_PORT: "40000"
      MEDIASOUP_MAX_PORT: "40199"
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      # MEDIASOUP_ANNOUNCED_IP must come from server/.env (or a root .env that
      # compose interpolates). Never default it to 127.0.0.1 here — that overrides
      # env_file and breaks remote video/audio.
      FRONTEND_URL: ${FRONTEND_URL:-https://meet.samtal.cc:8981}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://meet.samtal.cc:8981,http://46.246.120.148:8980,http://localhost,http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://meet.samtal.cc:8981/auth/google/callback}
    ports:
      # mediasoup enables UDP + TCP ICE; publish both or TCP fallback cannot work.
      - "40000-40199:40000-40199/udp"
      - "40000-40199:40000-40199/tcp"
    volumes:
      - server_storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://46.246.120.148:8980}
    restart: unless-stopped
    # Host Ubuntu nginx owns public :8980 and proxies to this loopback port.
    # Do not bind 8980 here — that fights the host proxy and causes 502.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server_storage:
