server_tokens off;
client_max_body_size 32m;

upstream samhal_api {
  server server:4001;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Socket.IO + realtime
  location /socket.io/ {
    proxy_pass http://samhal_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Google OAuth start + callback are top-level HTML navigations and must hit
  # the API, not the SPA (prefix ^~ skips the shared /auth regex below).
  location ^~ /auth/google {
    proxy_pass http://samhal_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_cookie_path / /;
  }

  # Same-origin API + SPA share prefixes like /auth and /admin.
  # Browser navigations (Accept: text/html) get the SPA; XHR/fetch hit the API.
  location ~ ^/(auth|workspaces|billing|meetings|workspace-meetings|workspace-rooms|workspace-teams|workspace-templates|dashboard|calendar|messages|reports|recordings|admin|health|metrics|media)(/|$) {
    set $serve_spa 0;
    if ($http_accept ~* text/html) {
      set $serve_spa 1;
    }
    if ($uri ~ ^/(health|metrics|media)(/|$)) {
      set $serve_spa 0;
    }
    if ($serve_spa = 1) {
      rewrite ^ /index.html last;
    }

    proxy_pass http://samhal_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_cookie_path / /;
  }

  # SPA assets + client routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
