services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "4001"
      STORAGE_DIR: /app/storage
      RECORDING_FFMPEG_PATH: ffmpeg
      MEDIASOUP_WORKERS: "2"
      MEDIASOUP_MIN_PORT: "40000"
      MEDIASOUP_MAX_PORT: "40199"
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      # MEDIASOUP_ANNOUNCED_IP comes from server/.env / root .env — do not default to 127.0.0.1
      FRONTEND_URL: ${FRONTEND_URL:-https://meet.samtal.cc:8981}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://meet.samtal.cc:8981,http://46.246.120.148:8980,http://localhost,http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://meet.samtal.cc:8981/auth/google/callback}
      MONGODB_URI: mongodb://mongo:27017/meetspace
    ports:
      - "40000-40199:40000-40199/udp"
      - "40000-40199:40000-40199/tcp"
    volumes:
      - server_storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-https://meet.samtal.cc:8981}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  server_storage:
  mongo_data:
